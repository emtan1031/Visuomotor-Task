<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Visuomotor Prism Task</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: black;
}
body {
  background: black;
  font-family: Arial;
  color: white;
  cursor: none;
  touch-action: none;
}
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  pointer-events: none;
  font-size: 20px;
}
#c {
  display: block;
}
</style>
</head>

<body>
<div id="info">Tap anywhere to start</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let CX = canvas.width / 2;
let CY = canvas.height / 2;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  CX = canvas.width / 2;
  CY = canvas.height / 2;
  draw();
}
window.addEventListener("resize", resizeCanvas);
document.addEventListener("fullscreenchange", resizeCanvas);

const BLOCKS = [
  {name:"baseline",        trials:10, prism:[0,0]},
  {name:"adaptation",      trials:50, prism:[0,0]},
  {name:"aftereffect",     trials:10, prism:[0,0]}
];
let blockIndex = 0;
let trial = 0;
let trial_in_block = 0;

let target = null;
let startTime = 0;
let data = [];

let prism_dx = 0;
let prism_dy = 0;
let time_pressure = false;
let dual_task = false;

let running = false;
let trialActive = false;

let redX = CX;
let redY = CY;
let showRed = true;

// ── SUBJECT / CONDITION SEQUENCING ──────────────────────────────────
function getSequenceState() {
  const stored = localStorage.getItem("prism_sequence_state");
  if (stored) return JSON.parse(stored);
  return { subject: 1, condition: "unstressed" };
}

function advanceSequenceState(current) {
  let next;
  if (current.condition === "unstressed") {
    next = { subject: current.subject, condition: "stressed" };
  } else {
    next = { subject: current.subject + 1, condition: "unstressed" };
  }
  localStorage.setItem("prism_sequence_state", JSON.stringify(next));
}

function getDateStamp() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

const sequenceState = getSequenceState();

const MIN_DIST_FROM_CENTER = 180;

function newTrial() {
  const block = BLOCKS[blockIndex];
  prism_dx = block.prism[0];
  prism_dy = block.prism[1];

  const side = Math.random() < 0.5 ? -1 : 1;
  const minD = MIN_DIST_FROM_CENTER;
  const maxD = (canvas.width / 2) - 80;
  const dist = minD + Math.random() * (maxD - minD);

  target = {
    x: CX + side * dist,
    y: CY
  };

  redX = CX;
  redY = CY;
  showRed = true;

  trialActive = true;
  startTime = performance.now();

  document.getElementById("info").innerText =
    `Block: ${block.name} | Trial ${trial_in_block + 1}/${BLOCKS[blockIndex].trials}`;

  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (target && trialActive) {
    ctx.fillStyle = "lime";
    ctx.beginPath();
    ctx.arc(target.x + prism_dx, target.y + prism_dy, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  if (showRed) {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(redX, redY, 14, 0, Math.PI * 2);
    ctx.fill();
  }
}

function enterFullscreenAndStart() {
  if (running) return;

  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();

  running = true;
  document.getElementById("info").innerText = "";

  setTimeout(() => {
    resizeCanvas();
    newTrial();
  }, 300);
}

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (!running) {
    enterFullscreenAndStart();
    return;
  }
}, { passive: false });

canvas.addEventListener("click", () => {
  if (!running) enterFullscreenAndStart();
});

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();

  if (!trialActive) return;

  const touch = e.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  const tx = touch.clientX - rect.left;
  const ty = touch.clientY - rect.top;

  recordResponse(tx, ty);
}, { passive: false });

function recordResponse(touchX, touchY) {
  trialActive = false;

  const rt = performance.now() - startTime;
  const error = Math.sqrt((touchX - target.x) ** 2 + (touchY - target.y) ** 2);

  data.push({
    timestamp_utc:    new Date().toISOString(),
    trial:            trial,
    block:            BLOCKS[blockIndex].name,
    trial_in_block:   trial_in_block,
    target_x:         Math.round(target.x),
    target_y:         Math.round(target.y),
    disp_target_x:    Math.round(target.x + prism_dx),
    disp_target_y:    Math.round(target.y + prism_dy),
    touch_x:          Math.round(touchX),
    touch_y:          Math.round(touchY),
    response_time_ms: Math.round(rt),
    error_px:         Math.round(error),
    subject_id:       sequenceState.subject,
    condition:        sequenceState.condition
  });

  redX = touchX;
  redY = touchY;
  draw();

  setTimeout(() => {
    showRed = false;
    draw();

    setTimeout(() => {
      trial++;
      trial_in_block++;

      if (trial_in_block >= BLOCKS[blockIndex].trials) {
        blockIndex++;
        trial_in_block = 0;
        if (blockIndex >= BLOCKS.length) {
          finish();
          return;
        }
      }
      newTrial();
    }, 200);
  }, 1000);
}

function finish() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  ctx.font = "32px Arial";
  ctx.fillText("Experiment complete. Downloading data...", 60, CY);

  const header = "timestamp_utc,trial,block,trial_in_block,target_x,target_y," +
    "disp_target_x,disp_target_y,touch_x,touch_y,response_time_ms,error_px," +
    "subject_id,condition\n";

  const rows = data.map(d =>
    `${d.timestamp_utc},${d.trial},${d.block},${d.trial_in_block},` +
    `${d.target_x},${d.target_y},${d.disp_target_x},${d.disp_target_y},` +
    `${d.touch_x},${d.touch_y},${d.response_time_ms},${d.error_px},` +
    `${d.subject_id},${d.condition}`
  ).join("\n");

  const blob = new Blob([header + rows], {type: "text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Prism Project/subject${sequenceState.subject}_${sequenceState.condition}_${getDateStamp()}.csv`;
  a.click();
  advanceSequenceState(sequenceState);
}
document.getElementById("info").innerText =
  `Subject ${sequenceState.subject} — ${sequenceState.condition} — Tap anywhere to start`;

draw();
</script>
</body>
</html>
